<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Channel Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <header class="brand-row">
      <div class="brand-copy">
        <div class="brand-mark" aria-hidden="true">↓</div>
        <div>
          <h1>Channel Downloader</h1>
          <p>Pick the videos you actually want.</p>
        </div>
      </div>
      <span id="helperStatus" class="status status-offline">Offline</span>
    </header>

    <section class="launcher-card">
      <span class="eyebrow">Full downloader</span>
      <h2>Paste a channel link, then choose the videos.</h2>
      <p class="supporting-copy">The full page gives the video list more room without changing the workflow you already use.</p>
      <button id="openDownloader" class="primary">Open Downloader <span aria-hidden="true">↗</span></button>
    </section>

    <section class="helper-card" aria-live="polite">
      <div class="helper-dot" aria-hidden="true"></div>
      <p id="helperMessage">Checking local helper…</p>
    </section>

    <footer>Runs locally through your helper.</footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
