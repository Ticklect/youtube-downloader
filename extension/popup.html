<!doctype html>
<html lang="en" data-theme="red">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="title-block">
        <h1>Channel Downloader</h1>
        <p>Save selected videos from a YouTube channel.</p>
      </div>
      <div class="header-tools">
        <span id="helperStatus" class="status status-offline">Helper Off</span>
        <div class="theme-switch" role="group" aria-label="Appearance theme">
          <button id="themeRed" class="theme-option" type="button" aria-pressed="true">Red</button>
          <button id="themeMono" class="theme-option" type="button" aria-pressed="false">Mono</button>
        </div>
      </div>
    </header>

    <section id="helperControl" class="helper-control utility-section" aria-label="Local helper controls">
      <div class="helper-control-row">
        <div class="helper-copy">
          <strong>Local helper</strong>
          <span id="helperControlMessage" class="message" aria-live="polite">Checking helper control…</span>
        </div>
        <label class="auto-start-row">
          <input id="autoStartHelper" type="checkbox" checked>
          <span>Auto-start when needed</span>
        </label>
        <button id="helperToggle" class="secondary compact-button" type="button">Turn On</button>
      </div>
    </section>

    <section class="source-section utility-section">
      <label class="field-label" for="channelUrl">Channel URL</label>
      <div class="input-row">
        <input id="channelUrl" type="url" placeholder="https://youtube.com/@channel" autocomplete="off" spellcheck="false">
        <button id="loadChannel" class="primary" type="button">Load channel</button>
      </div>
      <p id="channelMessage" class="message" aria-live="polite"></p>
    </section>

    <p id="errorMessage" class="error hidden" role="alert"></p>

    <section id="videoSection" class="video-section hidden">
      <div class="video-header">
        <div class="video-heading">
          <h2 id="channelName">Channel</h2>
          <span id="selectionCount" class="selection-count">0 selected</span>
        </div>
        <div class="video-actions">
          <button id="selectAll" class="text-button" type="button">Select all</button>
          <button id="clearAll" class="text-button" type="button">Clear</button>
        </div>
      </div>
      <div id="videoList" class="video-list"></div>
    </section>

    <section class="settings-row" aria-label="Download settings">
      <div class="setting-cell folder-cell">
        <span class="setting-label">Save to</span>
        <strong id="folderPath">No folder selected</strong>
        <button id="chooseFolder" class="text-button choose-folder" type="button">Choose folder</button>
      </div>

      <label class="setting-cell">
        <span class="setting-label">Output</span>
        <select id="mode">
          <option value="video">Video</option>
          <option value="audio">Audio (MP3)</option>
          <option value="transcript">Transcript</option>
          <option value="everything">Everything</option>
        </select>
      </label>

      <label class="setting-cell">
        <span class="setting-label">Quality</span>
        <select id="quality">
          <option value="360">360p</option>
          <option value="720">720p</option>
          <option value="1080">1080p</option>
          <option value="best">Best available</option>
        </select>
      </label>
    </section>

    <section id="progressPanel" class="progress-panel hidden">
      <div class="progress-header">
        <strong>Download progress</strong>
        <span id="progressSummary" class="muted"></span>
      </div>
      <div id="jobItems" class="job-list"></div>
    </section>

    <section class="download-bar">
      <div class="download-copy">
        <strong id="downloadSummary">Ready</strong>
        <span>Only selected videos will be downloaded.</span>
      </div>
      <div class="download-actions">
        <button id="retryFailed" class="secondary hidden" type="button">Retry failed</button>
        <button id="startDownload" class="primary download-button" type="button" disabled>Download selected</button>
      </div>
    </section>

    <footer>Download only content you own or have permission to save.</footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
